<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your study log, devices and account activity." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/src/img/favicon.png" />
    <title>Dashboard · TimSol</title>
    <script>
      // Runs before the page paints, so a saved theme never flashes the wrong colours.
      // Keep the logic in step with resolveTheme() in src/ts/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/dashboard.css" />
  </head>
  <body class="app-body">
    <!-- Shown until the route guard has checked the session, so nothing private flashes up. -->
    <div id="gate" class="gate" role="status">
      <p id="gateMessage">Checking your session…</p>
      <button id="retryButton" type="button" class="btn" hidden>Try again</button>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <a class="logo" href="#log" aria-label="TimSol Technologies, study log">
          <img src="/src/img/favicon.png" alt="" width="32" height="32" />
          <span>TimSol</span>
        </a>
        <div class="topbar-actions">
          <span class="who">Hi, <span id="userName"></span></span>
          <button id="themeToggle" class="theme-toggle theme-toggle--inline" type="button" aria-pressed="false">
            <span class="visually-hidden">Dark theme</span>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" />
            </svg>
          </button>
          <button id="signOutButton" type="button" class="btn btn--quiet">Sign out</button>
        </div>
      </header>

      <nav class="tabs" aria-label="Dashboard">
        <a href="#log" data-route="log">Study log</a>
        <a href="#devices" data-route="devices">Devices</a>
        <a href="#activity" data-route="activity">Activity</a>
        <a href="#security" data-route="security">Security</a>
        <a href="#users" data-route="users" data-admin-only hidden>Users</a>
      </nav>

      <main id="view" class="panel"></main>

      <footer class="footer-note">&copy; 2026 TimSol Technologies. All rights reserved.</footer>
    </div>

    <script type="module" src="/src/ts/dashboard.ts"></script>
  </body>
</html>
