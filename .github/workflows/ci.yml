name: CI

# Runs on every push to main and on every pull request, so a broken change is caught
# before it is merged.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code. Least privilege: no write access to the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # runs tsc (typecheck) and then vite build
      - run: npm test

  server:
    name: API (typecheck, test with real MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      # A real MongoDB, so the "two requests at once" tests really prove atomicity.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage