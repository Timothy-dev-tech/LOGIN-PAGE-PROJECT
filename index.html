<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Login Page</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <main class="login-container">
      <h1>Login</h1>
      <form id="loginForm" method="post" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
            aria-describedby="emailError"
          />
          <span id="emailError" class="error-message" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            aria-describedby="passwordError"
          />
          <span
            id="passwordError"
            class="error-message"
            aria-live="polite"
          ></span>
        </div>

        <label class="show-password-label">
          <input
            type="checkbox"
            class="password-checkbox"
            id="passwordToggle"
          />
          Show password
        </label>

        <div class="row">
          <label class="remember-me">
            <input
              class="remember-me-checkbox"
              type="checkbox"
              name="remember"
              id="remember"
            />
            Remember me
          </label>
        </div>

        <button type="submit" class="sign-in-btn">Sign in</button>
      </form>

      <p class="sign-up-text">
        Don't have an account?
        <a class="sign-up-link" href="/register.html">Create one</a>
      </p>
      <p class="footer-note">
        &copy; 2026 TimSol Technologies. All rights reserved.
      </p>
    </main>
    <script type="module" src="/src/ts/login.ts"></script>
  </body>
</html>
