<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/src/img/favicon.png" />
    <title>Sign in</title>
    <script>
      // Runs before the page paints, so a saved theme never flashes the wrong colours.
      // Keep the logic in step with resolveTheme() in src/ts/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="backdrop">
        <div class="brand" role="img" aria-label="TimSol Technologies"></div>
      </header>

      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-pressed="false"
      >
        <span class="visually-hidden">Dark theme</span>
        <svg
          class="icon-sun"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg
          class="icon-moon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" />
        </svg>
      </button>

      <main class="main">
        <div class="card">
          <div id="loginView">
            <h1>Sign in</h1>
            <form id="loginForm" method="post" novalidate>
              <div class="field">
                <label for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="Enter your email"
                  required
                  aria-describedby="emailError"
                />
                <span
                  id="emailError"
                  class="error-message"
                  aria-live="polite"
                ></span>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  required
                  aria-describedby="passwordError"
                />
                <span
                  id="passwordError"
                  class="error-message"
                  aria-live="polite"
                ></span>
              </div>

              <label class="show-password-label">
                <input
                  type="checkbox"
                  class="password-checkbox"
                  id="passwordToggle"
                />
                Show password
              </label>

              <div class="row">
                <label class="remember-me">
                  <input
                    class="remember-me-checkbox"
                    type="checkbox"
                    name="remember"
                    id="remember"
                  />
                  Remember me
                </label>
              </div>

              <p id="formError" class="form-error" role="alert" hidden></p>

              <button type="submit" class="sign-in-btn" id="submitButton">
                Sign in
              </button>
            </form>

            <p class="sign-up-text">
              Don't have an account?
              <a class="sign-up-link" href="/register.html">Create one</a>
            </p>
          </div>
        </div>
      </main>

      <footer class="footer-note">
        &copy; 2026 TimSol Technologies. All rights reserved.
      </footer>
    </div>
    <script type="module" src="/src/ts/login.ts"></script>
  </body>
</html>
